name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Print Node & NPM versions
        run: |
          node --version
          npm --version

      - name: Install dependencies (ci or install)
        run: npm ci || npm install

      - name: Build
        run: npm run build --if-present

      - name: Deploy to GitHub Pages (push to gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: build # The folder the action should deploy.
          clean: true
          # Prefer a user-provided Personal Access Token if set (useful when GITHUB_TOKEN lacks push permission)
          token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
